<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/banana-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` habilita las variables `env(safe-area-inset-*)`,
         que la app nativa usa para no meter la barra de navegación inferior
         bajo el indicador de inicio del iPhone. En un navegador normal valen
         cero y no cambian nada. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de la barra del sistema. El panel de agentes lo sobrescribe con
         su amarillo al montarse (ver src/lib/pwa.ts). -->
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Prototipo navegable de Banana Computer. Demostración conceptual con datos de ejemplo, sin sistemas reales."
    />
    <!-- Las tipografías NO se piden a ningún servicio externo: viajan en el
         bundle. Se importan en `src/main.tsx` desde `@fontsource`, con los
         mismos pesos que pedía el enlace remoto anterior. Volver a poner aquí
         una hoja de estilos de fuentes remota reintroduciría una dependencia
         de red en cada carga, y hay una prueba que lo vigila midiendo las
         peticiones del artefacto. -->
    <!-- Preload de la primera imagen del hero para acelerar el LCP en la home.
         La ruta va sin la base a propósito: Vite le antepone la que toque en
         cada build (`/pagina-banana/` en GitHub Pages, `/` en la app nativa).
         Escrita a mano daría 404 en el binario de iOS y Android. -->
    <link rel="preload" as="image" href="/img/products/17pro-plata.webp" fetchpriority="high" />
    <title>Banana Computer — Prototipo</title>
    <!-- Decodifica la ruta que 404.html guardó en la query (fallback SPA de GitHub Pages). -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <!-- Estilo del arranque nativo, en línea y no en la hoja del bundle.
         La hoja llega por red —local, pero red— y hasta entonces el documento
         no puede pintar: ahí se veía el amarillo del WebView sin logotipo,
         entre que la pantalla de arranque se retira y React monta. En línea,
         el primer pintado del documento ya trae fondo y rótulo, así que el
         relevo no tiene costura. Los mismos valores viven en `index.css` para
         el resto del ciclo. -->
    <style>
      html[data-native-boot],
      html[data-native-boot] body {
        background-color: #ffce1f;
      }
      #arranque-nativo {
        display: none;
      }
      html[data-native-boot] #arranque-nativo {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        background-color: #ffce1f;
      }
      html[data-native-boot] #arranque-nativo svg {
        width: min(52vw, 260px);
        height: auto;
      }
    </style>
    <!-- El marcador se pone en el `head`, antes del primer pintado. No puede
         mirar sólo `window.Capacitor`: el puente nativo se inyecta por su
         cuenta y aquí arriba puede no existir todavía. El esquema de la URL sí
         está desde el principio y sólo lo usa la app empaquetada. -->
    <script>
      if (window.Capacitor || location.protocol === 'capacitor:' || location.protocol === 'ionic:')
        document.documentElement.setAttribute('data-native-boot', '')
    </script>
  </head>

    <!-- Arranque de la app nativa: el documento nace con el color de marca.
         El WebView ya es amarillo (`ios.backgroundColor`), pero el documento

         blanco entre el fondo nativo y la cabecera de Inicio. Va aquí, en
         línea y antes del bundle, porque un efecto de React llega tarde: el
         primer pintado del documento ya habría ocurrido.
         `App` retira el marcador en cuanto monta. -->
    <!-- Rótulo de marca del arranque nativo. Va en línea, no como <img>, para
