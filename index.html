<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/banana-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` habilita las variables `env(safe-area-inset-*)`,
         que la app nativa usa para no meter la barra de navegación inferior
         bajo el indicador de inicio del iPhone. En un navegador normal valen
         cero y no cambian nada. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de la barra del sistema. El panel de agentes lo sobrescribe con
         su amarillo al montarse (ver src/lib/pwa.ts). -->
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Prototipo navegable de Banana Computer. Demostración conceptual con datos de ejemplo, sin sistemas reales."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Preload de la primera imagen del hero para acelerar el LCP en la home.
         La ruta va sin la base a propósito: Vite le antepone la que toque en
         cada build (`/pagina-banana/` en GitHub Pages, `/` en la app nativa).
         Escrita a mano daría 404 en el binario de iOS y Android. -->
    <link rel="preload" as="image" href="/img/products/17pro-plata.webp" fetchpriority="high" />
    <title>Banana Computer — Prototipo</title>
    <!-- Decodifica la ruta que 404.html guardó en la query (fallback SPA de GitHub Pages). -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Arranque de la app nativa: el documento nace con el color de marca.
         El WebView ya es amarillo (`ios.backgroundColor`), pero el documento
         se pintaba blanco hasta que React montaba, y eso dejaba un fotograma
         blanco entre el fondo nativo y la cabecera de Inicio. Va aquí, en
         línea y antes del bundle, porque un efecto de React llega tarde: el
         primer pintado del documento ya habría ocurrido.
         `App` retira el marcador en cuanto monta. -->
    <script>
      if (window.Capacitor) document.documentElement.setAttribute('data-native-boot', '')
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
