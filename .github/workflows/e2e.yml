name: Pruebas E2E (Playwright)

# Ejecuta las pruebas end-to-end de Playwright en cada push y pull request
# sobre `main`. No sustituye al workflow de despliegue: éste se limita a
# comprobar que el prototipo se puede compilar y navegar sin regresiones.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar (verifica tipos y bundle)
        run: npm run build
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
      - name: Publicar reporte HTML si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
