name: Deploy a GitHub Pages

# Publica la web en cada push a main. La primera vez hay que activar Pages en
# Settings → Pages → Source: "GitHub Actions" (una sola vez).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; cancela los anteriores en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Credenciales de Supabase (chat de Bananito y panel /agente).
      # Configurar en Settings → Secrets and variables → Actions:
      #   SUPABASE_URL       → https://<ref>.supabase.co
      #   SUPABASE_ANON_KEY  → anon/public key (empieza por eyJ...)
      # Si no están definidas, la web se despliega en modo demo (chat con
      # canned replies y el panel /agente muestra el aviso de configuración).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
